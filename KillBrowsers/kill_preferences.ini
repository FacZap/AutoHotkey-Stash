; KillBrowsers preferences
; Order: comma-separated list of buttons in display order (Firefox, Chrome).
;        The first entry is highlighted/focused by default when the GUI opens.
; DoNotOpenGUI: 1 = Ctrl+Alt+K instantly kills the first browser in Order, no GUI, no confirmation.
;               0 = show the GUI (default).
; CloseGUIAfterPress: 1 = GUI closes automatically after a Kill button is pressed (default).
;                      0 = GUI stays open after a Kill button is pressed.

[Settings]
Order=Chrome,Firefox
DoNotOpenGUI=0
CloseGUIAfterPress=1
